name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths:
      - mixer_version.py
      - .github/workflows/release.yml
      - tools/check_launch.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixer-hub-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
      - name: Run regression tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Build and validate artifacts
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tools/check_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tools/check_launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = .\.venv\Scripts\python.exe -c "from mixer_version import VERSION; print(VERSION)"
          Copy-Item "docs/releases/v$version.md" dist/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: MixerHub-release
          path: |
            dist/MixerHub.exe
            dist/build-manifest.json
            dist/MixerHub-firmware-*.zip
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MixerHub-release
          path: dist
      - name: Publish the completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $manifest = Get-Content dist/build-manifest.json -Raw | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          if ($manifest.source_commit -ne $env:GITHUB_SHA) { throw 'Artifact source commit mismatch' }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not (($existing | ConvertFrom-Json).isDraft)) {
              Write-Host "$tag is already published; leaving its assets intact."
              exit 0
            }
          } else {
            gh release create $tag --draft --title "Mixer Hub $tag" --target $env:GITHUB_SHA --notes-file dist/release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag dist/MixerHub.exe dist/build-manifest.json "dist/$($manifest.firmware.file)" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
